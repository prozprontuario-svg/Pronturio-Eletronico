 transform="translate(760.0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">03 / Início</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Visão do plantão</tspan></text></g></g></g><g transform="translate(0 118)"><g transform="translate(0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">04 / Pacientes</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Identificação do paciente</tspan></text></g></g><g transform="translate(380.0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">05 / Prontuário</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Prontuário e alertas</tspan></text></g></g><g transform="translate(760.0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">06 / Triagem</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Dados da avaliação inicial</tspan></text></g></g></g><g transform="translate(0 236)"><g transform="translate(0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">07 / Anotações de enfermagem</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Registros do plantão</tspan></text></g></g><g transform="translate(380.0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">08 / Nova anotação</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Rascunho do cuidado</tspan></text></g></g><g transform="translate(760.0 0)"><rect x="0.5" y="0.5" width="359.0" height="97" rx="8" fill="#FFFFFF" stroke="#DDE3E5"/><g transform="translate(20 20)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="17" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="17">09 / Revisar anotação</tspan></text></g><g transform="translate(20 57)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Conferência e finalização</tspan></text></g></g></g></g><g transform="translate(40 576)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="18" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="18">Após finalizar, retornar ao Prontuário.</tspan></text></g><g transform="translate(40 627)"><rect x="0.5" y="0.5" width="1119.0" height="0" rx="0" fill="#DDE3E5" stroke="none"/></g><g transform="translate(40 652.0)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="24" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="24">Fluxos complementares</tspan></text></g><g transform="translate(40 711.0)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="16" font-weight="400" fill="#171A1C" text-anchor="start"><tspan x="0" y="16">Prontuário → Exames / Prescrição / Histórico / Documentos / Saída hospitalar</tspan><tspan x="0" y="40">Início → Cirurgias → Detalhes → Prontuário</tspan></text></g><g transform="translate(40 783.0)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="24" font-weight="700" fill="#171A1C" text-anchor="start"><tspan x="0" y="24">Perfis e responsabilidade</tspan></text></g><g transform="translate(40 842.0)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="16" font-weight="400" fill="#171A1C" text-anchor="start"><tspan x="0" y="16">O técnico consulta anamnese, exame físico e prescrição. Registra cuidados e checagem conforme permissão institucional. Classificação de risco e saída</tspan><tspan x="0" y="40">hospitalar pertencem ao profissional autorizado.</tspan></text></g><g transform="translate(40 914.0)"><text font-family="Arial,Nimbus Sans,sans-serif" font-size="14" font-weight="400" fill="#667075" text-anchor="start"><tspan x="0" y="14">Todos os nomes, identificadores e valores são fictícios. O protótipo não sugere diagnóstico, doses ou condutas.</tspan></text></g></g></svg>